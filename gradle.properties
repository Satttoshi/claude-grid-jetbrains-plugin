pluginGroup=io.github.satttoshi.claudegrid
pluginName=Grid for Claude Code
pluginVersion=0.5.1

# Target: IntelliJ IDEA 2026.2.3 (build 262.10968.63).
pluginSinceBuild=262
platformVersion=2026.2.3

# Optional: build and run against a locally installed IDE instead of downloading one.
# This is machine specific, so set it in ~/.gradle/gradle.properties, not here, e.g.
# platformLocalPath=/Applications/IntelliJ IDEA.app

# The IDE bundles the Kotlin stdlib; don't package our own.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
